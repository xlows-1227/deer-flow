# DeerFlow Live Deployment (CentOS-friendly)
#
# Goal:
# - Reuse already-built base images (gateway + frontend) on the host
# - Only pull latest git code on the host
# - Bind-mount code into containers and restart them (no `--build` needed)
#
# Prerequisites:
#   export DEER_FLOW_ROOT=/opt/deer-flow
#
# If an old stack is already running (deer-flow-postgres / deer-flow-nginx),
# stop it first to free ports 5432 and 2026:
#   docker stop deer-flow-postgres deer-flow-nginx
#   # or: docker compose -p deer-flow -f docker/docker-compose.yaml down
#
# Usage:
#   1) First time:
#      docker compose --env-file .env -p deer-flow-live -f docker/docker-compose-live.yaml up -d
#   2) Subsequent code updates:
#      git pull
#      docker compose --env-file .env -p deer-flow-live -f docker/docker-compose-live.yaml restart gateway frontend
#      # frontend restart will re-run `pnpm build` then `pnpm start` (first request becomes fast after build)
#
# Note:
# - Gateway runs without `--reload` (UVICORN_RELOAD=0).
# - Frontend runs production mode (build + start), not `next dev`, for acceptable latency.
# - Postgres is NOT published to the host by default (avoids 5432 conflicts).
#   Set POSTGRES_PORT=5432 (or another free port) only if you need host access.

services:
  nginx:
    image: nginx:alpine
    container_name: deer-flow-live-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-live
    restart: unless-stopped

  frontend:
    image: deer-flow-frontend:live
    container_name: deer-flow-live-frontend
    command: ["sh", "/usr/local/bin/frontend-live-entrypoint.sh"]
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./frontend-live-entrypoint.sh:/usr/local/bin/frontend-live-entrypoint.sh:ro
      - ../frontend/src:/app/frontend/src:cached
      - ../frontend/public:/app/frontend/public:cached
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      - frontend-next-output:/app/frontend/.next
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - CI=true
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-live
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: deer-flow-live-postgres
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deerflow}
      POSTGRES_DB: ${POSTGRES_DB:-deerflow}
    volumes:
      - ${POSTGRES_DATA_DIR:-/data/postgres}:/var/lib/postgresql/data
    # Host port is optional. Uncomment / set POSTGRES_PORT only when needed.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - deer-flow-live
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deerflow} -d ${POSTGRES_DB:-deerflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: deer-flow-gateway:live
    container_name: deer-flow-live-gateway
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    # CentOS/Docker often hits "RuntimeError: can't start new thread" without these.
    security_opt:
      - seccomp:unconfined
    pids_limit: -1
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      - gateway-venv:/app/backend/.venv
      # Overlay production runtime dir (must come after backend/ mount).
      - ${DEER_FLOW_HOME:-/var/lib/deer-flow}:/app/backend/.deer-flow
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      - gateway-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      # Override host paths from .env — inside the container these are bind-mounted.
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - AUTH_LOGIN_RSA_PRIVATE_KEY_FILE=/app/backend/.deer-flow/login_rsa_private.pem
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-/var/lib/deer-flow}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT:-/opt/deer-flow}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - GATEWAY_TRUSTED_PROXIES=${GATEWAY_TRUSTED_PROXIES:-192.168.220.0/24}
      - UVICORN_RELOAD=0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-deerflow}:${POSTGRES_PASSWORD:-deerflow}@postgres:5432/${POSTGRES_DB:-deerflow}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-live
    restart: unless-stopped

volumes:
  gateway-venv:
  gateway-uv-cache:
  frontend-next-output:

networks:
  deer-flow-live:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.220.0/24

