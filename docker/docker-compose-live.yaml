# DeerFlow Live Deployment (CentOS-friendly)
#
# Goal:
# - Reuse already-built base images (gateway + frontend) on the host
# - Only pull latest git code on the host
# - Bind-mount code into containers and restart them (no `--build` needed)
#
# Usage:
#   1) First time (optional, but recommended):
#      docker compose -p deer-flow-live -f docker/docker-compose-live.yaml up -d --build
#   2) Subsequent updates:
#      docker compose -p deer-flow-live -f docker/docker-compose-live.yaml up -d
#
# Note:
# - This compose intentionally runs Gateway without `--reload`.
#   Set UVICORN_RELOAD=0 (default in this file) to disable hot reload.

services:
  nginx:
    image: nginx:alpine
    container_name: deer-flow-live-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-live
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: deer-flow-frontend:live
    container_name: deer-flow-live-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src:cached
      - ../frontend/public:/app/frontend/public:cached
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      - frontend-next-cache:/app/frontend/.next
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-live
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: deer-flow-live-postgres
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deerflow}
      POSTGRES_DB: ${POSTGRES_DB:-deerflow}
    volumes:
      - ${POSTGRES_DATA_DIR:-/data/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - deer-flow-live
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deerflow} -d ${POSTGRES_DB:-deerflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    image: deer-flow-gateway:live
    container_name: deer-flow-live-gateway
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      - gateway-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - GATEWAY_TRUSTED_PROXIES=${GATEWAY_TRUSTED_PROXIES:-192.168.210.0/24}
      - UVICORN_RELOAD=0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-deerflow}:${POSTGRES_PASSWORD:-deerflow}@postgres:5432/${POSTGRES_DB:-deerflow}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-live
    restart: unless-stopped

volumes:
  gateway-venv:
  gateway-uv-cache:
  frontend-next-cache:

networks:
  deer-flow-live:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.220.0/24

